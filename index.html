<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zivo.com | Premium Marketplace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}
:root{--gold:#f5b51b;--blue:#087cff;--card:#111;--line:#2b2b2b;--muted:#999;--red:#e44}
.top{height:78px;background:#050505;border-bottom:1px solid #191919;display:flex;align-items:center;gap:18px;padding:0 4%;position:sticky;top:0;z-index:50}.adminTop{background:#fbb817;color:#111;border:0;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer}.hamb{font-size:28px;color:#ddd;background:none;border:0}.logo{font-size:29px;font-weight:800;color:var(--gold);cursor:pointer;min-width:210px}.logo span{color:#1685ff}.tag{display:block;color:#aaa;font-size:10px;font-weight:400}.search{height:46px;display:flex;flex:1;max-width:630px;background:#101010;border:1px solid #333;border-radius:11px;overflow:hidden}.search input{flex:1;background:none;border:0;outline:0;color:#fff;padding:0 15px}.search button{width:60px;border:0;background:var(--gold);font-size:22px}.actions{display:flex;gap:14px}.actions button{background:none;border:0;color:#ddd;font-size:11px;position:relative}.ico{display:block;font-size:21px}.badge{position:absolute;background:var(--gold);color:#111;border-radius:15px;padding:2px 6px;top:-3px;right:1px;font-size:9px}
main{width:92%;max-width:1250px;margin:18px auto 90px}.hero{height:255px;border:1px solid #292929;border-radius:16px;overflow:hidden;position:relative;background:radial-gradient(circle at 75%,#49360c,#111 45%,#050505 75%)}.heroText{padding:32px 8%;position:relative;z-index:2}.hero small{color:var(--gold);font-weight:bold}.hero h1{font-size:48px;margin:7px 0}.hero h1 span{color:var(--gold)}.hero p{font-size:19px}.hero button,.primary{background:var(--gold);border:0;border-radius:8px;padding:12px 22px;font-weight:bold;color:#111}.heroArt{position:absolute;right:7%;top:55px;font-size:90px}.dots{position:absolute;bottom:7px;left:0;right:0;text-align:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin:3px}.dot.on{background:#1685ff;width:17px;border-radius:8px}
.head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.head h2{margin:0;font-size:20px}.link{border:0;background:none;color:#1685ff}.cats{display:grid;grid-template-columns:repeat(9,1fr);gap:11px}.cat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 4px;text-align:center;color:#ddd}.cat:hover,.cat.sel{border-color:var(--blue);box-shadow:0 0 13px #087cff44}.cat b{display:block;font-size:29px;color:var(--gold);margin-bottom:7px}.cat span{font-size:11px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px;position:relative}.pic{height:125px;background:#080808;border-radius:8px;display:grid;place-items:center;font-size:70px;cursor:pointer}.off{position:absolute;right:7px;top:7px;background:var(--red);padding:5px;border-radius:4px;font-size:10px;font-weight:bold}.card h3{font-size:13px;margin:9px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stars{font-size:11px;color:#ffc21b}.price{color:var(--gold);font-weight:bold;margin-top:7px}.old{text-decoration:line-through;color:#666;font-size:10px;margin-left:4px}.mini{float:right;background:#151515;border:1px solid #6d5418;color:var(--gold);border-radius:5px;padding:5px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:17px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.sellergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.seller{background:#080808;border-radius:9px;padding:11px;font-size:11px}.seller p{color:#aaa;margin:6px 0}.arrivals{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.arr{background:#171717;border-radius:9px;text-align:center;padding:7px}.arr div{font-size:43px;height:65px;display:grid;place-items:center}.arr p{font-size:10px;color:var(--gold)}
.bottom{display:none}.field{width:100%;padding:11px;border:1px solid #333;background:#090909;color:#fff;border-radius:8px;outline:0}.formbox{max-width:470px;margin:35px auto;background:var(--card);border:1px solid var(--line);padding:25px;border-radius:17px}.formbox h1{text-align:center;color:var(--gold)}.form{display:grid;gap:10px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.detailPic{min-height:390px;background:#080808;border-radius:12px;display:grid;place-items:center;font-size:160px}.qty{display:inline-flex;border:1px solid #444;border-radius:7px;overflow:hidden}.qty button,.qty span{background:#171717;color:#fff;border:0;padding:8px 13px}.cartrow{display:grid;grid-template-columns:70px 1fr auto auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}.thumb{height:60px;background:#080808;border-radius:7px;display:grid;place-items:center;font-size:35px}.summary{max-width:480px;margin:15px 0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.sum{display:flex;justify-content:space-between;margin:8px 0}.total{border-top:1px solid #333;padding-top:10px;color:var(--gold);font-weight:bold;font-size:18px}.empty{text-align:center;padding:55px;background:var(--card);border:1px dashed #444;border-radius:14px;color:#aaa}
.admin{display:grid;grid-template-columns:220px 1fr;gap:15px}.adminSide,.adminMain{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.adminSide h2{color:var(--gold);margin-top:4px}.adminSide button{width:100%;text-align:left;background:none;border:0;color:#bbb;padding:11px;border-radius:7px}.adminSide button:hover,.adminSide button.active{background:#1c1c1c;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#080808;border:1px solid #292929;border-radius:10px;padding:13px}.stat small{color:#aaa}.stat strong{display:block;color:var(--gold);font-size:22px;margin-top:7px}.adminTable{width:100%;border-collapse:collapse;margin-top:14px}.adminTable th,.adminTable td{border-bottom:1px solid #292929;padding:9px;text-align:left;font-size:12px}.adminTable th{color:#999}.danger{background:none;border:0;color:#ff7777}.ok{color:#52dc8b}.adminLogin{max-width:400px;margin:45px auto;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:27px}.adminLogin h1{text-align:center;color:var(--gold)}.notice{padding:10px;background:#211b0a;border:1px solid #5c4917;border-radius:8px;color:#ddd;font-size:12px;margin-bottom:12px}.toast{position:fixed;right:15px;bottom:80px;background:#191919;border:1px solid #555;border-radius:8px;padding:12px;z-index:100}
@media(max-width:1050px){.cats{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.admin{grid-template-columns:1fr}}
@media(max-width:650px){.top{height:auto;min-height:70px;flex-wrap:wrap;padding:9px 4%}.logo{font-size:22px;min-width:0}.search{order:5;flex-basis:100%}.actions{margin-left:auto}.actions button:nth-child(-n+2){display:none}.hero{height:220px}.heroText{padding:27px 6%;width:75%}.hero h1{font-size:34px}.heroArt{font-size:55px;right:-6%;top:70px}.cats{grid-template-columns:repeat(3,1fr);gap:7px}.grid{grid-template-columns:repeat(2,1fr)}.pic{height:105px;font-size:57px}.twocol{grid-template-columns:1fr}.sellergrid{grid-template-columns:repeat(2,1fr)}.arrivals{grid-template-columns:repeat(3,1fr)}.detail{grid-template-columns:1fr}.detailPic{min-height:270px;font-size:110px}.cartrow{grid-template-columns:60px 1fr}.cartrow .qty,.cartrow .remove{grid-column:2}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:#111;border-top:1px solid #333;z-index:45;justify-content:space-around}.bottom button{background:none;border:0;color:#aaa;font-size:10px}.bottom b{display:block;font-size:20px}.bottom .active{color:var(--gold)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
<button class="hamb" onclick="go('admin')">☰</button><button class="adminTop" onclick="go('admin')">⚙ Admin</button>
<div class="logo" onclick="go('home')">Hassan<span>.com</span><small class="tag">Your Trusted Marketplace</small></div>
<div class="search"><input id="search" placeholder="Search products, brands and more..." oninput="search(this.value)"><button>⌕</button></div>
<div class="actions"><button onclick="toast('No new notifications')"><span class="ico">♧</span>Notifications</button><button onclick="go('wishlist')"><span class="ico">♡</span>Wishlist</button><button onclick="go('cart')"><span class="ico">🛒<i id="badge" class="badge">0</i></span>Cart</button></div>
</header>
<main id="app"></main>
<nav class="bottom"><button onclick="go('home')"><b>⌂</b>Home</button><button onclick="go('categories')"><b>▦</b>Categories</button><button onclick="go('cart')"><b>🛒</b>Cart</button><button onclick="go('orders')"><b>▢</b>Orders</button><button onclick="go('profile')"><b>♙</b>Profile</button></nav>
<div id="toast"></div>
<script>
const CATS=[['Electronics','📱'],['Fashion','👕'],['Mobiles','📲'],['Home & Kitchen','🍳'],['Beauty','🧴'],['Sports','⚽'],['Grocery','🛒'],['Toys & Games','🧸'],['Automotive','🚗']];
const seed=[
[1,'AirPods Pro 2','Electronics',28999,52999,45,'🎧',4.8,230],[2,'Smart Watch Series 8','Electronics',15999,26999,40,'⌚',4.6,180],[3,'Nike Sports Shoes','Sports',3899,5999,35,'👟',4.5,210],[4,'Tommy Perfume','Beauty',2799,3999,30,'🧴',4.7,150],[5,'Premium Backpack','Fashion',2249,2999,25,'🎒',4.4,95],[6,'Gaming Headset','Electronics',4999,9999,50,'🎧',4.6,310],[7,'Blue Smartphone','Mobiles',59999,69999,15,'📱',4.6,120],[8,'Pro Laptop','Electronics',89999,109999,18,'💻',4.8,88],[9,'Golden Dress','Fashion',4999,6999,29,'👗',4.5,74],[10,'Comfort Sofa','Home & Kitchen',24999,31999,22,'🛋️',4.4,42],[11,'Classic Sunglasses','Fashion',1299,1899,32,'🕶️',4.3,65],[12,'Football','Sports',1999,2499,20,'⚽',4.7,91]
].map(x=>({id:x[0],name:x[1],cat:x[2],price:x[3],old:x[4],off:x[5],icon:x[6],rating:x[7],reviews:x[8]}));
let products=JSON.parse(localStorage.getItem('hc_products')||'null')||seed;
let cart=JSON.parse(localStorage.getItem('hc_cart')||'[]'),orders=JSON.parse(localStorage.getItem('hc_orders')||'[]'),users=JSON.parse(localStorage.getItem('hc_users')||'[]'),wishlist=JSON.parse(localStorage.getItem('hc_wish')||'[]');
let current=JSON.parse(localStorage.getItem('hc_current')||'null'),page='home',cat='All',term='',pid=0,qty=1,adminTab='dashboard';
function save(){localStorage.setItem('hc_products',JSON.stringify(products));localStorage.setItem('hc_cart',JSON.stringify(cart));localStorage.setItem('hc_orders',JSON.stringify(orders));localStorage.setItem('hc_users',JSON.stringify(users));localStorage.setItem('hc_wish',JSON.stringify(wishlist));localStorage.setItem('hc_current',JSON.stringify(current));badge()}
function badge(){document.getElementById('badge').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function money(n){return'Rs. '+Number(n).toLocaleString('en-PK')}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.getElementById('toast').appendChild(x);setTimeout(()=>x.remove(),2200)}
function go(p){page=p;render()}
function search(v){term=v;page='search';render()}
function filtered(){return products.filter(p=>(cat==='All'||p.cat===cat)&&(!term||(p.name+' '+p.cat).toLowerCase().includes(term.toLowerCase())))}
function cards(a){return a.map(p=>`<article class="card"><span class="off">-${p.off}%</span><div class="pic" onclick="product(${p.id})">${p.icon}</div><h3>${p.name}</h3><div class="stars">★ ${p.rating} (${p.reviews})</div><div class="price">${money(p.price)} <span class="old">${money(p.old)}</span><button class="mini" onclick="add(${p.id})">🛒</button></div></article>`).join('')}
function catHTML(){return CATS.map(c=>`<button class="cat ${cat===c[0]?'sel':''}" onclick="cat='${c[0]}';go('categories')"><b>${c[1]}</b><span>${c[0]}</span></button>`).join('')}
const pages={
home:()=>`<section class="hero"><div class="heroText"><small>BIGGEST SALE OF THE YEAR</small><h1>MEGA <span>DEALS</span></h1><p>UP TO <b style="color:#1685ff">70% OFF</b></p><button onclick="go('categories')">SHOP NOW</button></div><div class="heroArt">⌚ 🎧 📱</div><div class="dots"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div></section><div class="head"><h2>Shop by Categories</h2><button class="link" onclick="go('categories')">View All</button></div><div class="cats">${catHTML()}</div><div class="head"><h2>⚡ Flash Sale</h2><span style="color:#1685ff">02 : 16 : 45</span></div><div class="grid">${cards(products.slice(0,6))}</div><div class="twocol"><section class="panel"><div class="head"><h2>Top Sellers</h2></div><div class="sellergrid">${['Electro Hub','Fashion World','Mobile Zone','Home Store'].map((x,i)=>`<div class="seller"><b>${x}</b><p>⭐ ${4.9-i/10}</p><p>${[12.5,9.8,15.2,8.1][i]}K Sales</p></div>`).join('')}</div></section><section class="panel"><div class="head"><h2>New Arrivals</h2></div><div class="arrivals">${products.slice(6,11).map(p=>`<div class="arr" onclick="product(${p.id})"><div>${p.icon}</div><p>${money(p.price)}</p></div>`).join('')}</div></section></div>`,
categories:()=>`<h1>Categories</h1><div class="cats">${catHTML()}</div><div class="head"><h2>${cat}</h2><span>${filtered().length} products</span></div><div class="grid">${cards(filtered())||'<div class="empty">No products.</div>'}</div>`,
search:()=>`<h1>Search Results</h1><div class="grid">${cards(filtered())||'<div class="empty">No matching products.</div>'}</div>`,
product:()=>{let p=products.find(x=>x.id===pid);return `<button class="link" onclick="go('categories')">← Back</button><div class="detail"><div class="detailPic">${p.icon}</div><div><span class="off" style="position:static;display:inline-block">-${p.off}%</span><h1>${p.name}</h1><div class="stars">★ ${p.rating} (${p.reviews} Reviews)</div><h2 style="color:var(--gold)">${money(p.price)} <span class="old">${money(p.old)}</span></h2><p style="color:#aaa;line-height:1.7">Premium marketplace product. Product details, specifications, delivery and seller information can be managed from the admin panel.</p><p>Quantity: <span class="qty"><button onclick="qty=Math.max(1,qty-1);render()">−</button><span>${qty}</span><button onclick="qty++;render()">+</button></span></p><button class="primary" onclick="add(${p.id},qty)">Add to Cart</button> <button class="primary" onclick="buy(${p.id})">Buy Now</button></div></div>`},
cart:()=>{if(!cart.length)return'<h1>My Cart</h1><div class="empty"><h2>🛒 Cart is empty</h2><button class="primary" onclick="go(\'categories\')">Start Shopping</button></div>';let t=cart.reduce((s,x)=>s+x.price*x.qty,0);return`<h1>My Cart</h1>${cart.map(x=>`<div class="cartrow"><div class="thumb">${x.icon}</div><div><b>${x.name}</b><p style="color:var(--gold)">${money(x.price)}</p></div><div class="qty"><button onclick="change(${x.id},-1)">−</button><span>${x.qty}</span><button onclick="change(${x.id},1)">+</button></div><button class="link remove" onclick="remove(${x.id})">🗑</button></div>`).join('')}<div class="summary"><div class="sum"><span>Subtotal</span><b>${money(t)}</b></div><div class="sum"><span>Shipping</span><b>${money(150)}</b></div><div class="sum total"><span>Total</span><span>${money(t+150)}</span></div><button class="primary" style="width:100%" onclick="go('checkout')">Proceed to Checkout</button></div>`},
checkout:()=>`<h1>Checkout</h1><div class="twocol"><section class="panel"><h2>Shipping Address</h2><div class="form"><input class="field" id="coName" placeholder="Full Name"><input class="field" id="coPhone" placeholder="Phone Number"><input class="field" id="coAddress" placeholder="House / Street / City"><textarea class="field" id="coNote" placeholder="Order note"></textarea><h3>Payment Method</h3><label><input name="pay" type="radio" value="Cash on Delivery" checked> Cash on Delivery</label><label><input name="pay" type="radio" value="EasyPaisa"> EasyPaisa</label><label><input name="pay" type="radio" value="JazzCash"> JazzCash</label><label><input name="pay" type="radio" value="Card"> Card</label><button class="primary" onclick="placeOrder()">Place Order</button></div></section><section class="panel"><h2>Order Summary</h2>${cart.map(x=>`<div class="sum"><span>${x.name} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join('')}</section></div>`,
login:()=>`<div class="formbox"><h1>Welcome Back</h1><div class="form"><input class="field" id="liId" placeholder="Email / Phone"><input class="field" id="liPass" type="password" placeholder="Password"><button class="primary" onclick="login()">Login</button><button class="primary" onclick="demo()">Demo Customer Login</button><p style="text-align:center">Don't have an account? <button class="link" onclick="go('signup')">Sign Up</button></p><button class="link" onclick="go('seller')">Become a Seller</button></div></div>`,
signup:()=>`<div class="formbox"><h1>Create Account</h1><div class="form"><input class="field" id="suName" placeholder="Full Name"><input class="field" id="suEmail" placeholder="Email"><input class="field" id="suPhone" placeholder="Phone Number"><input class="field" id="suPass" type="password" placeholder="Password"><button class="primary" onclick="signup()">Sign Up</button><button class="link" onclick="go('login')">Already have an account? Login</button></div></div>`,
seller:()=>`<div class="formbox"><h1>Become a Seller</h1><div class="form"><input class="field" id="ssName" placeholder="Full Name"><input class="field" id="ssEmail" placeholder="Email"><input class="field" id="ssPhone" placeholder="Phone Number"><input class="field" id="ssShop" placeholder="Shop Name"><input class="field" id="ssPass" type="password" placeholder="Password"><button class="primary" onclick="sellerSignup()">Create Seller Account</button></div></div>`,
profile:()=>current?`<h1>My Profile</h1><div class="panel"><h2>👤 ${current.name}</h2><p>${current.email||''}</p><p>${current.phone||''}</p><p>Account: ${current.role||'customer'}</p></div><div class="panel"><button class="link" onclick="go('orders')">My Orders</button><br><button class="link" onclick="go('wishlist')">Wishlist</button><br>${current.role==='admin'?'<button class="link" onclick="go(\'admin\')">⚙ Admin Panel</button><br>':''}<button class="link" onclick="go('seller')">Seller Center</button><br><button class="link" onclick="logout()">Logout</button></div>`:`<div class="empty"><h2>Login required</h2><button class="primary" onclick="go('login')">Login</button><br><button class="primary" style="margin-top:12px" onclick="go('admin')">⚙ Admin Panel</button></div>`,
wishlist:()=>{let a=products.filter(p=>wishlist.includes(p.id));return`<h1>Wishlist</h1>${a.length?'<div class="grid">'+cards(a)+'</div>':'<div class="empty">♡<h2>Wishlist is empty</h2></div>'}`},
orders:()=>{let a=orders.filter(o=>!current||o.user===current.email);return`<h1>My Orders</h1>${a.length?a.map(o=>`<div class="panel" style="margin-bottom:9px"><b>#${o.id}</b>　<span class="ok">${o.status}</span><p>${o.items.map(x=>x.name+' × '+x.qty).join(', ')}</p><b>${money(o.total)}</b></div>`).join(''):'<div class="empty">No orders yet.</div>'}`},
admin:()=>current?.role==='admin'?adminHTML():(page='adminLogin',pages.adminLogin()),
adminLogin:()=>`<div class="adminLogin"><h1>Zivo.com Admin</h1><div class="notice">Demo admin for this single-file GitHub version.<br>Username: <b>Hassan</b> &nbsp; Password: <b>hassan240250</b></div><div class="form"><input class="field" id="ai" placeholder="Admin Username"><input class="field" id="ap" type="password" placeholder="Password"><button class="primary" onclick="adminLogin()">Admin Login</button><button class="primary" style="width:100%;margin-top:10px" onclick="go('admin')">⚙ Open Admin Panel</button><button class="link" style="width:100%;margin-top:12px" onclick="go('home')">← Back to Store</button></div></div>`
};
function adminHTML(){let total=orders.reduce((s,o)=>s+o.total,0);return`<h1>Admin Panel</h1><div class="admin"><aside class="adminSide"><h2>Zivo.com</h2>${[['dashboard','📊 Dashboard'],['products','📦 Products'],['orders','🧾 Orders'],['customers','👥 Customers'],['sellers','🏪 Sellers'],['categories','🗂 Categories']].map(x=>`<button class="${adminTab===x[0]?'active':''}" onclick="adminTab='${x[0]}';render()">${x[1]}</button>`).join('')}<button onclick="go('home')">🏠 Store</button><button onclick="logout()">🚪 Logout</button></aside><section class="adminMain">${adminTab==='dashboard'?adminDash():adminTab==='products'?adminProducts():adminTab==='orders'?adminOrders():adminTab==='customers'?adminCustomers():adminTab==='sellers'?adminSellers():adminCategories()}</section></div>`}
function adminDash(){return`<div class="stats"><div class="stat"><small>Products</small><strong>${products.length}</strong></div><div class="stat"><small>Orders</small><strong>${orders.length}</strong></div><div class="stat"><small>Customers</small><strong>${users.filter(u=>u.role==='customer').length}</strong></div><div class="stat"><small>Revenue</small><strong>${money(totalRevenue())}</strong></div></div><div class="panel" style="margin-top:15px"><h2>Quick Actions</h2><button class="primary" onclick="adminTab='products';render()">+ Add Product</button> <button class="primary" onclick="adminTab='orders';render()">View Orders</button></div>`}
function adminProducts(){return`<h2>Products</h2><div class="form row2"><input class="field" id="pn" placeholder="Product name"><select class="field" id="pc">${CATS.map(c=>`<option>${c[0]}</option>`).join('')}</select><input class="field" id="pp" type="number" placeholder="Price"><input class="field" id="po" type="number" placeholder="Old Price"><input class="field" id="pi" placeholder="Icon e.g. 📱" value="📦"><input class="field" id="pd" type="number" placeholder="Discount %"></div><button class="primary" style="margin-top:10px" onclick="addProduct()">Add Product</button><table class="adminTable"><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Action</th></tr>${products.map(p=>`<tr><td>${p.id}</td><td>${p.icon} ${p.name}</td><td>${p.cat}</td><td>${money(p.price)}</td><td><button class="danger" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join('')}</table>`}
function adminOrders(){return`<h2>Orders</h2><table class="adminTable"><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr>${orders.map(o=>`<tr><td>#${o.id}</td><td>${o.user}</td><td>${money(o.total)}</td><td>${o.status}</td><td><button class="link" onclick="statusOrder(${o.id})">Change Status</button></td></tr>`).join('')||'<tr><td colspan="5">No orders</td></tr>'}</table>`}
function adminCustomers(){let a=users.filter(u=>u.role==='customer');return`<h2>Customers</h2><table class="adminTable"><tr><th>Name</th><th>Email</th><th>Phone</th></tr>${a.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||''}</td></tr>`).join('')}</table>`}
function adminSellers(){let a=users.filter(u=>u.role==='seller');return`<h2>Sellers</h2><table class="adminTable"><tr><th>Name</th><th>Shop</th><th>Email</th></tr>${a.map(u=>`<tr><td>${u.name}</td><td>${u.shop||'-'}</td><td>${u.email}</td></tr>`).join('')||'<tr><td colspan="3">No sellers</td></tr>'}</table>`}
function adminCategories(){return`<h2>Categories</h2><div class="cats">${CATS.map(c=>`<div class="cat"><b>${c[1]}</b><span>${c[0]}</span><small style="display:block;color:#999;margin-top:6px">${products.filter(p=>p.cat===c[0]).length} products</small></div>`).join('')}</div>`}
function totalRevenue(){return orders.reduce((s,o)=>s+o.total,0)}
function product(id){pid=id;qty=1;page='product';render()}
function add(id,n=1){let p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty+=n:cart.push({...p,qty:n});save();toast('Product added to cart');}
function change(id,n){let x=cart.find(x=>x.id===id);x.qty+=n;if(x.qty<1)cart=cart.filter(y=>y.id!==id);save();render()}
function remove(id){cart=cart.filter(x=>x.id!==id);save();render()}
function buy(id){add(id,qty);go('checkout')}
function placeOrder(){if(!cart.length)return;let t=cart.reduce((s,x)=>s+x.price*x.qty,0)+150;let pay=document.querySelector('input[name=pay]:checked').value;orders.push({id:Date.now().toString().slice(-6),user:current?.email||document.getElementById('coPhone').value,items:cart,total:t,payment:pay,status:'Pending'});cart=[];save();toast('Order placed successfully');go('orders')}
function signup(){let u={name:suName.value,email:suEmail.value,phone:suPhone.value,password:suPass.value,role:'customer'};if(!u.name||!u.email||!u.password)return toast('Please fill required fields');users.push(u);current=u;save();toast('Account created');go('profile')}
function sellerSignup(){let u={name:ssName.value,email:ssEmail.value,phone:ssPhone.value,shop:ssShop.value,password:ssPass.value,role:'seller'};users.push(u);current=u;save();toast('Seller account created');go('profile')}
function login(){let u=users.find(x=>(x.email===liId.value||x.phone===liId.value)&&x.password===liPass.value);if(!u)return toast('Invalid login');current=u;save();go('profile')}
function demo(){current={name:'Hassan Raza',email:'demo@hassan.com',phone:'03000000000',role:'customer'};save();go('profile')}
function logout(){current=null;save();go('home')}
function adminLogin(){if(ai.value==='admin'&&ap.value==='admin123'){current={name:'Administrator',email:'admin@zivo.com',role:'admin'};save();adminTab='dashboard';go('admin')}else toast('Wrong admin username or password')}
function addProduct(){let p={id:Date.now(),name:pn.value,cat:pc.value,price:+pp.value||0,old:+po.value||+pp.value||0,off:+pd.value||0,icon:pi.value||'📦',rating:5,reviews:0};if(!p.name||!p.price)return toast('Enter product name and price');products.unshift(p);save();toast('Product added');render()}
function deleteProduct(id){if(confirm('Delete this product?')){products=products.filter(p=>p.id!==id);save();render()}}
function statusOrder(id){let o=orders.find(x=>x.id===id);let s=prompt('Enter status: Pending / Processing / Shipped / Delivered / Cancelled',o.status);if(s){o.status=s;save();render()}}
function initAdmin(){if(!users.some(u=>u.role==='admin')){users.push({name:'Administrator',email:'admin@zivo.com',password:'admin123',role:'admin'});localStorage.setItem('hc_users',JSON.stringify(users))}}
function render(){document.getElementById('app').innerHTML=pages[page]?pages[page]():pages.home();badge()}
initAdmin();render();badge();
</script>
</body>
</html>
